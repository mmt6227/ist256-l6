<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="statics/styles.css">
</head>
<body>
    <h1 class="text-center" style="padding: 20px;">User Signup</h1>
    <p class="text-center">Create an account to get started.</p>

    <form class="m-3" onsubmit="return validateForm()">
        <div style="width: 500px; margin: 0 auto;">
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" class="form-control" id="username" placeholder="Enter username" onfocusout="validate(this)">
                <div id="usernameError" style="color: #FF0000;"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address:</label>
                <input type="text" class="form-control" id="email" placeholder="joe@test.com" onfocusout="validate(this)">
                <div id="emailError" style="color: #FF0000;"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" onfocusout="validate(this)">
                <div id="passwordError" style="color: #FF0000;"></div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password:</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" onfocusout="validate(this)">
                <div id="confirmPasswordError" style="color: #FF0000;"></div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="button" class="btn btn-secondary" onclick="window.open('https://mmt6227.github.io/ist256-l2')">Back to storefront</button>
        </div>
    </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <script src="statics/script.js"></script>
</body>
</html>
